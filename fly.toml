# Configuración de despliegue en Fly.io
# Docs: https://fly.io/docs/reference/configuration/

app = "transurfing"
primary_region = "mia"  # cámbialo a tu región (p.ej. scl, gru, iad); debe coincidir con la del volumen "datos"

[env]
  TAREAS_DATA_DIR = "/data"
  STORAGE_BACKEND = "json"
  CORS_ORIGINS = "*"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "datos"
  destination = "/data"
